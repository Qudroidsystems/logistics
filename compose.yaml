services:

    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - logistics
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    pgsql:
        image: 'postgres:17'
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-logistics}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'logistics-pgsql:/var/lib/postgresql/data'
        networks:
            - logistics
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-U'
                - '${DB_USERNAME:-sail}'
                - '-d'
                - '${DB_DATABASE:-logistics}'
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'logistics-redis:/data'
        networks:
            - logistics
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5

        reverb:
        image: sail-8.4/app
        command: >
            bash -c "php artisan reverb:start --host=0.0.0.0 --port=8080"
        ports:
            - '${REVERB_PORT:-8080}:8080'
        volumes:
            - '.:/var/www/html'
        networks:
            - logistics
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy

    queue:
        image: sail-8.4/app
        command: >
            bash -c "php artisan queue:work redis --sleep=3 --tries=3 --timeout=90"
        volumes:
            - '.:/var/www/html'
        networks:
            - logistics
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy
            pgsql:
                condition: service_healthy
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${MAILPIT_PORT:-8025}:8025'
            - '1025:1025'
        networks:
            - logistics

    pgadmin:
        image: 'dpage/pgadmin4:latest'
        environment:
            PGADMIN_DEFAULT_EMAIL: '${PGADMIN_EMAIL:-admin@logistics.test}'
            PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_PASSWORD:-adminpassword}'
        ports:
            - '${PGADMIN_PORT:-5050}:80'
        volumes:
            - 'logistics-pgadmin:/var/lib/pgadmin'
        networks:
            - logistics
        depends_on:
            pgsql:
                condition: service_healthy

networks:
    logistics:
        driver: bridge

volumes:
    logistics-pgsql:
        driver: local
    logistics-redis:
        driver: local
    logistics-pgadmin:
        driver: local
